# Two STM32H743 boards on ONE ESP32 probe, as a JTAG daisy-chain.
#   openocd -f stm32h7-rbb-dual.cfg
# Start rbb_bridge.py first (`make bridge`).
#
# BOTH boards must be powered and wired: OpenOCD examines every TAP at
# init, so one missing board fails the whole chain. For single-board work
# use stm32h7-rbb.cfg, which is unchanged.
#
# ## Wiring
#
# The three push-pull control lines are DUPLICATED -- each board gets its
# own driver pin rather than a Y-splice -- and only TDI/TDO chain, which
# is the one wire that makes it a chain:
#
#   ESP32 21 (TDI) --> board1 PA15
#                      board1 PB3  --> board2 PA15    <-- the chain wire
#                                      board2 PB3 --> ESP32 22 (TDO)
#   ESP32 18 (TCK)   --> board1 PA14      ESP32 26 --> board2 PA14
#   ESP32 19 (TMS)   --> board1 PA13      ESP32 27 --> board2 PA13
#   ESP32 23 (nTRST) --> board1 PB4       ESP32 13 --> board2 PB4
#   ESP32 25 (nSRST) --> board1 NRST  +  board2 NRST   (shared, see below)
#   GND common to all three.  Power each board from its own supply.
#
# The duplicate pins all live in GPIO bank 0, so the firmware switches a
# line and its copy in the SAME w1ts/w1tc store: there is no skew between
# the two boards' TCK at all. (Not that there was a margin problem to fix
# -- remote_bitbang runs at a measured 42236 edges/s, ~20 kHz of TCK, so
# a half-period is 25 us against nanoseconds of anything else. The point
# is one driver per board and no splices, not timing.)
#
# nSRST is deliberately NOT duplicated: it is open-drain and wired-OR by
# nature, so multi-drop is the normal arrangement, and duplicating it
# would not buy per-board reset anyway -- remote_bitbang drives both
# resets from one pair of commands ('r'..'u'). So nSRST resets BOTH
# boards at once. For the audio-link stand that is what you want, a
# common start of time; to reset one alone use SYSRESETREQ on that
# target (`targets stmA.cpu0; mww 0xE000ED0C 0x05FA0004`).
#
# Probe firmware: esp32_rbb builds with DUAL_PROBE=1 by default, which is
# what drives the copies. -DDUAL_PROBE=0 gives a single-board probe that
# provably never touches those pins (test_pinmask.cpp asserts both).
#
# Cost of the chain: while OpenOCD talks to one board, the other board's
# two TAPs sit in BYPASS and add 2 bits to each DR scan. DAP DR scans are
# 35 bits, so that is ~6%. IR scans do double (9 -> 18 bits) but are rare
# next to the DR traffic that dominates flashing.

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 3335

# JTAG only -- see stm32h7-rbb.cfg. A daisy-chain is a JTAG-only trick in
# any case: SWD has no chaining, it would need a mux or a second probe.
transport select jtag

# The scan chain, declared by sourcing the stock target file twice.
#
# Each board contributes the SAME pair in the same order (cpu irlen 4,
# then bs irlen 5), so two boards chained in either physical order give
# the same repeating 4,5,4,5 pattern -- which is why this declaration is
# correct without having to pin down OpenOCD's TDI-vs-TDO ordering
# convention first. What the convention DOES decide is which label lands
# on which physical board. Settle that empirically with `ab_ids`: it
# prints each chip's UID in exactly the form the USB serial uses, so the
# label maps to a board you can then address by
# `host/ofdm_modem.py --serial`.
#
# stm32h7x.cfg is safe to source twice: it takes CHIPNAME from the
# environment, and its helper procs either take the target as an argument
# or recover the chip name from `target current` rather than a global.
set CHIPNAME stmA
source [find target/stm32h7x.cfg]
set CHIPNAME stmB
source [find target/stm32h7x.cfg]

reset_config srst_only srst_nogate connect_assert_srst

# --- convenience -------------------------------------------------------

# 96-bit unique ID, formatted exactly as ofdm_usb_serial() does (24 hex
# chars, memory byte order) so it can be compared with the USB serial.
proc ab_uid {chip} {
	set s ""
	foreach w [$chip.cpu0 read_memory 0x1FF1E800 32 3] {
		for {set i 0} {$i < 4} {incr i} {
			append s [format %02X [expr {($w >> (8 * $i)) & 0xFF}]]
		}
	}
	return $s
}

# Which label is which board. Match against `lsusb -v` iSerial, or
# host/ofdm_modem.py --serial.
proc ab_ids {} {
	foreach chip {stmA stmB} {
		echo "$chip  uid/serial [ab_uid $chip]"
	}
}

# The USB-modem beacon at 0x24000000 (see cport/usb/usb_flash_main.c).
proc ab_beacon {chip} {
	set w [$chip.cpu0 read_memory 0x24000000 32 7]
	set magic [lindex $w 0]
	if {$magic != 0x05BF1A54} {
		echo [format "$chip  beacon magic 0x%08x -- not the USB firmware, or not booted" $magic]
		return
	}
	echo [format "$chip  stage %d mounted %d ms %d rx %d tx %d isr %d" \
		[lindex $w 1] [lindex $w 2] [lindex $w 3] \
		[lindex $w 4] [lindex $w 5] [lindex $w 6]]
}

proc ab_beacons {} {
	foreach chip {stmA stmB} { ab_beacon $chip }
}

# Flash one board without disturbing the other.
#
# Deliberately NOT `program`: that runs `reset init` first, and with the
# shared open-drain nSRST a `reset` restarts BOTH boards -- then OpenOCD
# waits for every target to halt and gives up with "timed out while
# waiting for target halted". Halting just this target and writing the
# image touches nothing else on the chain. Measured: halting stmA alone
# leaves stmB.cpu0 running, which is exactly what we want while the
# other board is mid-transfer.
proc ab_flash {chip file} {
	targets $chip.cpu0
	halt
	flash write_image erase $file
	verify_image $file
	# and reset THIS board only, for the same reason: SYSRESETREQ is
	# per-core, `reset` would go out over the shared nSRST line.
	$chip.cpu0 mww 0xE000ED0C 0x05FA0004
	echo "$chip flashed and reset"
}

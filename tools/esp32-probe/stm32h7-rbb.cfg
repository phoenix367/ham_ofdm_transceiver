# STM32H7 through the ESP32 remote_bitbang probe.
#   openocd -f stm32h7-rbb.cfg
# Start rbb_bridge.py first.

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 3335

# JTAG, because PA15 (TDI) and PB3 (TDO) are broken out on this board --
# which means the PACKAGED OpenOCD 0.12 is enough. Its remote_bitbang is
# JTAG-only; `transport select swd` answers "only one transport option;
# autoselect 'jtag'". Swap these two lines only after building OpenOCD
# from master, which is what SWD would need (see README).
transport select jtag
# transport select swd

# No `adapter speed` line: remote_bitbang has no clock generator, and
# OpenOCD says so ("This adapter doesn't support configurable speed").
# The rate is set by the serial link instead -- one character per edge,
# measured at 42236 edges/s over the 921600-baud bridge.

source [find target/stm32h7x.cfg]

# The H7 boots with its debug clocks gated in some low-power states;
# connecting under reset avoids losing the DP on a running target.
reset_config srst_only srst_nogate connect_assert_srst
